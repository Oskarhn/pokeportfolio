name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub Actions is free for this private repo up to 2,000 minutes/month, and
# the account's default spending limit is $0 — a run simply fails to start
# past that, it never bills. See docs/COST_POLICY.md.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the secret-scan step below

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack and activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Domain and property tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Secret scan (gitleaks, open source, no license key)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source=/repo -v --redact
