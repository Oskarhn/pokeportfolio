name: CI

# P188: a push to a `release/**` branch runs the same validation jobs as a pull request, so a release
# candidate is judged by CI before any PR exists. The Production deploy job below is gated on
# `github.ref == 'refs/heads/main'`, so such a push can never deploy and never needs a Production
# secret (tests/config/workflow-deploy-gate.test.ts proves both).
on:
  push:
    branches: [main, 'release/**']
  pull_request:

# GitHub Actions is free for this private repo up to 2,000 minutes/month, and
# the account's default spending limit is $0 — a run simply fails to start
# past that, it never bills. See docs/COST_POLICY.md.
#
# Only pull-request runs are cancelled when a newer commit arrives. A WORKFLOW-level
# `cancel-in-progress: true` cancels the whole superseded run, including a `deploy-production` job
# that is mid-upload — a job-level `concurrency` block does not shield a job from it (GitHub docs,
# "Control the concurrency of workflows and jobs"). Runs on `main` therefore queue instead (at most
# one pending; a newer pending run replaces an older pending one), and the exact-SHA guard in
# `deploy-production` decides whether a queued run is still the one to deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for every job below (P142 §14): checkout only. `deploy-production`
# needs nothing more than this either — it authenticates to Cloudflare with its own scoped API
# token (a repository secret, never a GITHUB_TOKEN permission), not with any GitHub API write
# scope, so there is no job-specific permission to add for it.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the secret-scan step below

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack and activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # P188: the documentation set the next session reads first must stay readable and truthful in
      # form: HANDOVER.md / PROJECT_STATE.json within their size budgets, PROJECT_STATE.json valid and
      # pointing at files that exist, and every relative link in the current-state, release and mobile
      # documents resolving. Pure filesystem checks, no network.
      - name: Documentation checks (size budget, project state, links)
        run: |
          node scripts/check-doc-size.mjs
          node scripts/check-project-state.mjs
          node scripts/check-doc-links.mjs

      - name: Domain and property tests
        run: pnpm test

      # The same placeholder Supabase configuration the E2E suite builds against
      # (playwright.config.ts). vite.config.ts derives the deployed Content-Security-Policy from
      # VITE_SUPABASE_URL and refuses to build without it, so a build that quietly emitted a policy
      # naming nothing is not possible — here or on Cloudflare.
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-key

      # P160: `pnpm build` already refused a secret-shaped or misplaced public value (prebuild runs
      # scripts/check-public-env.mjs first). This judges what was actually WRITTEN: dist/ must be
      # complete and contain no secret-shaped string. Paths and categories only are printed.
      - name: Built artefact secret scan (dist/)
        run: node scripts/check-dist-secrets.mjs

      # P130-27/P130-28/P139: local-artifact release verifiers that were never wired into CI —
      # both are pure filesystem checks against dist/ from the build above, no network, seconds
      # to run. Static/local mode only (no DEPLOYMENT_URL/live SUPABASE_URL): the live-deployment
      # half of each (Cloudflare header/CSP checks, robots.txt/sitemap.xml live fetch) stays a
      # manual post-deploy step — see docs/DEVELOPMENT.md §9 and scripts/deployment-check.mjs's
      # own header comment — because CI never has a real deployment or a real Supabase project to
      # point at (docs/TESTING.md §10). SUPABASE_URL is set here to exactly the placeholder this
      # job's own build used, so the platform verifier's structural connect-src check is exercised
      # for real rather than skipped.
      - name: Platform build verifier (dist/_headers, dist/sw.js artefact gate)
        run: node scripts/verify-scanner-platform-build.mjs
        env:
          SUPABASE_URL: http://127.0.0.1:54321

      - name: Link/route checker (robots.txt/sitemap.xml/PUBLIC_ROUTES three-way consistency, static mode)
        run: node scripts/check-links.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # Auth UI, routing and guards, at desktop and iPhone viewports. Builds against a
      # placeholder Supabase URL on purpose (playwright.config.ts) so no remote credential is
      # ever needed here -- real auth flows are proven in the db-tests job below.
      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Secret scan (gitleaks, open source, no license key)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml -v --redact

  # Migrations, RLS and the two-client authorization suite (docs/TESTING.md §4-5), against an
  # ephemeral local Supabase/Postgres stack — ubuntu-latest ships Docker, so this needs nothing
  # beyond what's already free. Never touches the real dev/production Supabase project: no
  # remote credentials are used anywhere in this job. See docs/DEVELOPMENT.md §4 and prompt §57-58.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack and activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P189: the erasure registry the delete-account Edge Function records to. The values are
      # generated for this run (never literals) and handed to the stack at start through
      # supabase/config.toml [edge_runtime.secrets]; tests/db/global-setup.ts and the authenticated
      # E2E start the file-backed reference sink on that address. 172.17.0.1 is the Docker host as
      # seen from the stack's containers on a Linux runner (UNVERIFIED until the first CI run; the
      # function refuses every deletion, fail closed, if the sink is not reachable).
      - name: Generate the ephemeral erasure-registry credentials for this run
        run: |
          {
            echo "ERASURE_REGISTRY_URL=http://172.17.0.1:8787"
            echo "ERASURE_REGISTRY_TOKEN=$(openssl rand -hex 24)"
            echo "ERASURE_REGISTRY_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start local Supabase stack (applies every migration to an empty database)
        run: pnpm exec supabase start

      - name: 'Reset and reapply from scratch (reproducibility: empty DB -> migrations -> seed)'
        run: pnpm exec supabase db reset

      - name: Export local Supabase connection details
        run: |
          pnpm exec supabase status -o env > /tmp/supabase-status.env
          {
            echo "SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '\"')"
            echo "DB_URL=$(grep '^DB_URL=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '\"')"
            # The P161/P164 ledger specs read the local database URL under this name (TESTING.md §6e).
            # Without it the authenticated E2E refuses to run price-check-ledger.spec.ts in CI.
            echo "P153_DB_URL=$(grep '^DB_URL=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '\"')"
            # P189: the restore-safe-deletion suite runs pg_dump / pg_restore inside the stack's own
            # database container as the superuser (tests/db/p189_restore_safe_erasure.test.ts).
            echo "P156_DB_CONTAINER=$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          } >> "$GITHUB_ENV"

      # The privilege checks below talk to Postgres directly. Every runner image ships psql, but
      # a job that silently skipped this because the binary moved would be the same class of
      # false green the checks exist to prevent.
      - name: Ensure a psql client is present
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # Every local dev/test session already does this before running any suite (P130-12
      # workaround, restated in every P137/P138/P139/P140 session's own INTEGRATION_NOTES) —
      # CI never did. m12-recompute-snapshots reschedules itself every single minute
      # (20260901120000_p42_cron_cadence.sql); left active for this job's ~15+ minutes, it can
      # race a test's own direct call to the same drain_portfolio_recompute_queue RPC for a lock
      # and trip Postgres' statement_timeout under CI's shared-runner load — the same documented
      # class of runner-load-dependent flake tests/db/setup.ts already names for unrelated bulk
      # deletes. The jobs stay defined (schema/definition tests still see them); only their CI-run
      # activity is suppressed, matching what every local run already does.
      - name: Deactivate recurring cron jobs for the test run
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select cron.alter_job(jobid, active := false) from cron.job;"

      # PostgREST always connects to Postgres as `authenticator` (its one DB login role) and uses
      # `SET ROLE` to switch to whatever role a request's JWT claims (anon/authenticated/
      # service_role) for privilege purposes only — `SET ROLE` does not re-apply the target role's
      # own login-time GUC defaults, so every PostgREST-routed call (any `.rpc()`/REST call,
      # regardless of claimed role) is actually capped by `authenticator`'s own platform defaults
      # `statement_timeout=8s` AND `lock_timeout=8s` (`select rolconfig from pg_roles where
      # rolname='authenticator'`), never by service_role's own (unset) timeouts. A direct psql
      # connection (grant-audit, restore-drill, this file's own steps above) never goes through
      # authenticator and is unaffected. Two independent CI-only suites have now hit this: M16's
      # backdated-timeline case rebuilds one user's portfolio_snapshots from 2026-01-01 through
      # today in a single drain_portfolio_recompute_queue() call (~260 days' worth of legitimately
      # correct work); M13's export-scale-audit bulk-seeds/cleans up 10k+ rows
      # (tests/db/setup.ts's own CLEANUP_BATCH_SIZE comment already documented this exact
      # runner-load-dependent class for unrelated bulk deletes) and can wait on a lock past 8s
      # under CI's shared, slower runner even though nothing is actually deadlocked. Both finish
      # well under either limit on typical local hardware. `ALTER ROLE ... SET` only changes the
      # default for NEW connections — PostgREST keeps a small long-lived pool, so the two steps
      # below both matter: raising the role defaults alone was verified locally to NOT reach
      # already-open pooled connections; restarting the REST container forces it to reconnect
      # under the new defaults. Neither ships to Production (this lives in neither a migration nor
      # the app) and neither masks an incorrect result — it only gives a slow-but-correct
      # statement, or a lock wait that would genuinely resolve, enough time to finish.
      - name: Raise the PostgREST-routed statement/lock timeouts for this CI run
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "alter role authenticator set statement_timeout = '2min'; alter role authenticator set lock_timeout = '2min';"
          docker restart "$(docker ps --filter name=supabase_rest_ --format '{{.Names}}')"
          sleep 3

      # What the catalog actually grants `anon` and `authenticated`, asserted against the intended
      # surface rather than inferred from behaviour. docs/SECURITY.md §5.9.
      - name: Privilege surface matches the baseline
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/grant-audit.sql

      # The M4 escalation, encoded. Make the database wrong in exactly the way the deployed project
      # was, prove the audit notices, re-apply the hardening migration, prove it converges. The
      # middle step matters as much as the last one: an audit that cannot fail is not a check.
      - name: Convergence from a hostile privilege state
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/db/sql/hostile_grants.sql
          if psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/grant-audit.sql 2>/dev/null; then
            echo "::error::the audit passed on a database with hostile grants — the audit is broken"
            exit 1
          fi
          echo "audit correctly rejected the hostile state; re-applying the baseline migration"
          # The *latest* pure-privilege restatement, selected by filename convention rather than
          # hardcoded — every migration that restates the complete grant list is named
          # "*_privilege_baseline.sql", and migration filenames are timestamp-prefixed, so a plain
          # sort picks the newest one. This closes the fragility a hardcoded filename produced at
          # M5 (SECURITY.md §5.9, M6 prompt §14): re-applying only an older restatement converges
          # to a surface missing every grant a later milestone added, and a maintainer had to
          # remember to update this step by hand on every milestone that touched the
          # browser-reachable surface. A missing baseline file now fails the build outright rather
          # than silently reusing a stale one.
          baseline=$(ls supabase/migrations/*_privilege_baseline.sql | sort | tail -n 1)
          if [ -z "$baseline" ]; then
            echo "::error::no *_privilege_baseline.sql migration found — cannot verify convergence"
            exit 1
          fi
          echo "using $baseline as the current privilege baseline"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$baseline"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/grant-audit.sql

      # supabase start runs the edge runtime and serves supabase/functions, but a suite that
      # silently skipped the redeem-invitation tests because the function was unreachable
      # would be worse than useless -- so reachability is asserted before the suite runs. A
      # nonsense token must come back 400 from our own handler; anything else means the
      # function is not there.
      - name: Verify the redeem-invitation function is served
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -d "{\"token\":\"definitely-not-a-real-invitation-token\"}" "$SUPABASE_URL/functions/v1/redeem-invitation" || true)
            if [ "$code" = "400" ]; then echo "redeem-invitation is serving (HTTP $code)"; exit 0; fi
            echo "attempt $attempt: HTTP $code"
            sleep 4
          done
          echo "redeem-invitation never became reachable"
          pnpm exec supabase status || true
          exit 1

      - name: Database and authorization tests
        run: pnpm test:db

      # P130-28/P139: real, signed-in, UI-driven authenticated form behavior (TESTING.md §6b, P94)
      # never ran anywhere but by hand before this — the placeholder-backend suite in build-and-
      # test deliberately never touches a real Supabase project (docs/TESTING.md §6). This job
      # already has the one thing that infrastructure needs: a fresh, freshly-migrated local
      # Supabase stack on Docker, with SUPABASE_URL/ANON_KEY/SERVICE_ROLE_KEY already exported
      # above. Chromium only — the authenticated project only registers `desktop-chromium-
      # authenticated` (playwright.config.ts), so webkit is never needed here.
      - name: Install Playwright (chromium only, for authenticated E2E)
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated E2E (real sign-in, real data, real Supabase — TESTING.md §6b)
        run: pnpm exec playwright test --project desktop-chromium-authenticated
        env:
          PLAYWRIGHT_AUTHENTICATED_E2E: '1'

      - name: Upload authenticated-E2E Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: playwright-report
          retention-days: 7

      # The independently written M12 adversarial contract package (test/m12-independent-adversarial/,
      # authored implementation-blind on test/m12-independent-adversarial) judged against this same
      # ephemeral stack. Two steps, both mandatory: the standalone strict typecheck of the package,
      # then every DB-gated suite for real — the differential oracle users, queue mechanics,
      # security and honesty suites all execute here, never a compile-only gate.
      - name: Independent M12 adversarial suite (typecheck)
        run: pnpm exec tsc -p test/m12-independent-adversarial/tsconfig.json --noEmit

      - name: Independent M12 adversarial suite (DB-gated execution)
        run: pnpm test:m12-adversarial

      # The independently written M13 adversarial contract package (test/m13-independent-
      # adversarial/, authored implementation-blind on test/m13-independent-adversarial-p37)
      # judged against the integrated M13 candidate on this same ephemeral stack — the first
      # environment where its DB-backed cross-user suite AND its implementation-gated backup
      # contract execute for real — see the M13 steps further down for why they run after the
      # benchmarks. Two mandatory steps, mirroring the M12 pattern.

      # Separate validation step (audit, not microbenchmark theatre): catastrophic-only thresholds
      # per TESTING.md/D-059 policy. Thresholds are never weakened to obtain green.
      - name: Independent M12 adversarial scale audit
        run: pnpm test:m12-adversarial perf
        env:
          M12_PERF_AUDIT: '1'

      # M9.1 re-run of the M7 10,000-lot Portfolio gate (TESTING.md §7, D-054): list_portfolio grew
      # a real resolver join in M9, and no session between M9 and M9.1 re-measured it against real
      # data. Safe here because it needs only this ephemeral stack's local well-known service-role
      # key (already exported above), never a production credential or a real account. Runs BEFORE
      # the storage benchmark below deliberately: that step inserts 365,000 synthetic rows into
      # price_snapshots, which resolve_variant_market_values also queries — running it first would
      # measure list_portfolio's resolver join against a table ~1000x the realistic watched-set
      # size and produce a misleading number (found the hard way — see PROJECT_JOURNAL.md).
      - name: Portfolio 10k-lot performance benchmark
        run: node scripts/portfolio-perf-benchmark.mjs

      # M12 snapshot-engine gate (TESTING.md §7, prompt §98-§102): rebuild timings at realistic
      # scale (30/90/365-day ranges over ~10k lots with daily price history), one production-
      # shaped daily incremental drain, the four signed-in Home read RPCs, and real on-disk
      # storage of portfolio_snapshots — measured post-ANALYZE like the gate above, against this
      # same disposable ephemeral database. Same single-generous-threshold policy (D-059):
      # background rebuilds get a wide budget; Home reads fail past 1.5s.
      - name: Portfolio snapshots performance & storage benchmark
        run: node scripts/portfolio-snapshots-benchmark.mjs

      # M9.1 capacity gate (COST_POLICY.md, DATA_MODEL.md §4.2): measures real Postgres storage for
      # price_snapshots against a representative synthetic dataset in this disposable ephemeral
      # database — never against a database holding real data. See the script header for why.
      - name: Price-snapshot storage benchmark
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/price-snapshots-storage-benchmark.sql

      # The independently written M13 adversarial contract package (test/m13-independent-
      # adversarial/, authored implementation-blind on test/m13-independent-adversarial-p37)
      # judged against the integrated M13 candidate on this same ephemeral stack — the first
      # environment where its DB-backed cross-user suite AND its implementation-gated backup
      # contract execute for real. Two mandatory steps, mirroring the M12 pattern. Positioned
      # AFTER every timing-sensitive benchmark below on purpose: the adversarial fixture churns
      # synthetic accounts, and the export scale audit seeds ~26k rows — neither may sit between
      # a benchmark's seed and its timed calls (the M12 scale audit tripped its own 30s budget
      # exactly once when these steps ran in front of it).
      - name: Independent M13 adversarial suite (typecheck)
        run: pnpm exec tsc -p test/m13-independent-adversarial/tsconfig.json --noEmit

      - name: Independent M13 adversarial suite (DB-gated execution)
        run: pnpm test:m13-adversarial

      # The independently written M16 (Openings) adversarial contract package
      # (tests/m16-independent/, P52, authored implementation-blind against the canonical docs
      # without reading the M16 implementation branch) — P130-28 found this suite existed but
      # never ran anywhere except by hand. No separate typecheck step: unlike test/m12-/m13-
      # independent-adversarial (which live under test/, outside every tsconfig's include list),
      # tests/m16-independent/ is already covered by tsconfig.app.json's "tests" include, so the
      # build-and-test job's own Typecheck step already gates it. Every DB-gated case here is
      # IMPLEMENTATION_GATED (see the package's README "Case classification" table): it discovers
      # the M16 surface at runtime through PostgREST's own OpenAPI description and fails loudly as
      # "[M16 CONTRACT] ..." on a divergence rather than silently loosening an assertion — it does
      # not silently skip just because M16 exists, only if the surface were ever removed.
      - name: Independent M16 adversarial suite (DB-gated execution)
        run: pnpm test:m16-adversarial

      # M13 export scale audit (prompt §24): seeds a ~10k-lot synthetic account and times the
      # real client-side export pipeline end to end under the owner JWT. Opt-in env gate; the
      # step reports real numbers and fails only past a catastrophic 60s budget (D-059 policy).
      - name: M13 export scale audit
        run: pnpm exec vitest run --config vitest.db.config.ts tests/db/m13_export_perf.test.ts
        env:
          M13_EXPORT_PERF: '1'

      - name: Generate TypeScript types from schema
        run: pnpm db:types

      - name: Upload generated types (reviewed and committed by hand, not auto-merged)
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/data/database.types.ts

      - name: Stop local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  # Explicit, CI-gated Production deploy (P130-08, P142, P163) — the target architecture
  # GIT_WORKFLOW.md §11 documents. Replaces Cloudflare's automatic Git-integrated deploy, which races
  # GitHub CI on the same push webhook with no ordering primitive between them. This job only BECOMES
  # the live deploy path once the owner has completed docs/security/RELEASE_PREFLIGHT_P163.md, in
  # order. Until the secrets below exist it fails closed at the first guard (a missing value is an
  # explicit error, never a silent no-op deploy).
  #
  # CONFIGURATION (P163). The two build-time values are the Supabase project URL and its PUBLISHABLE
  # key. Both end up PUBLIC in the browser bundle whichever way GitHub stores them. They are stored
  # as repository SECRETS, not variables, for one reason only: GitHub prints every step's resolved
  # `env:` block in the job log BEFORE the step runs, and it redacts secrets there but not
  # variables. A wrong value in a variable is therefore printed (the repository is public) before any
  # guard can object; a wrong value in a secret is masked. The names deliberately differ from the old
  # VITE_* variables so a stale, mis-filled variable can never be picked up by accident. No `vars.*`
  # expression may appear anywhere in this file (tests/config/release-pipeline-integration.test.ts).
  # Cloudflare credentials are repository secrets too — GitHub Environments and environment secrets
  # are not available for a private repository on the Free plan, so there is no `environment:` key.
  # Neither the configuration secrets nor the Cloudflare credentials may appear in any env block above
  # step level.
  deploy-production:
    needs: [build-and-test, db-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The one deployment concurrency mechanism: a dedicated group that serialises Production
    # deploys (at most one upload in flight, a later one queues — `cancel-in-progress: false`).
    # The workflow-level `ci-${{ github.ref }}` group above cancels only pull-request runs, which
    # is what keeps a queued push to main from cancelling an upload mid-flight. "Latest eligible
    # main wins" is enforced by the exact-SHA guard below, not by cancellation.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # FIRST guard, before dependencies are installed and before anything is built: the public
      # configuration must be a real `https://<ref>.supabase.co` URL and a `sb_publishable_` key. A
      # secret-shaped value, a key in the URL slot, or a local/placeholder value fails here with a
      # field name and a category — never a value. Unconditional (not gated on the stale-run check):
      # a misconfiguration is a real defect whichever commit this run is for. The values come from
      # SECRETS so the resolved env block of this very step is masked in the log (see above).
      - name: Public configuration guard (deploy profile)
        run: node scripts/check-public-env.mjs --require-hosted --process-env-only
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}

      - name: Enable Corepack and activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      # Stale-run refusal: build-and-test + db-tests together take several minutes, so origin/main
      # may have advanced past the SHA this run was triggered for by the time this job starts. Never
      # fails the job on a mismatch — a stale run losing to a newer one is the intended, safe
      # outcome, not a defect (scripts/lib/deploy-guards.mjs, tests/config/deploy-guards.test.ts).
      - name: Check that origin/main is still exactly this commit
        id: guard-main
        run: node scripts/release-guard.mjs remote-main-current --github-sha "$GITHUB_SHA"

      - name: Install dependencies
        if: steps.guard-main.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      # A clean build, always: nothing built earlier may survive into the upload directory. On a
      # fresh runner dist/ does not exist; this makes that a stated invariant instead of a
      # coincidence, so a refused or failed build can never leave stale assets for a later step.
      - name: Remove any pre-existing build output
        if: steps.guard-main.outputs.current == 'true'
        run: rm -rf dist

      # A SEPARATE production build, not a reuse of build-and-test's artifact: that job builds
      # against a placeholder Supabase URL on purpose (playwright.config.ts), which is the wrong
      # artifact to ship. `pnpm build` runs the guard again as `prebuild` (with any .env files
      # merged in) and vite.config.ts runs it a third time before any output is written.
      - name: Build for Production
        if: steps.guard-main.outputs.current == 'true'
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          # Selects the deploy profile inside `prebuild` and vite.config.ts (P160).
          PP_REQUIRE_HOSTED_PUBLIC_ENV: '1'

      # Judge what was WRITTEN: dist/ must be complete and free of secret-shaped strings. Runs
      # before the identity check and long before any upload.
      - name: Built artefact secret scan (dist/)
        if: steps.guard-main.outputs.current == 'true'
        run: node scripts/check-dist-secrets.mjs

      # The artifact about to be uploaded must declare exactly this commit, not a `+dirty` build
      # or any other SHA. Hard failure, never skipped — unlike the guard above, a mismatch here is
      # a real build defect, not a benign race.
      - name: Verify build identity before upload
        if: steps.guard-main.outputs.current == 'true'
        run: node scripts/release-guard.mjs build-identity --github-sha "$GITHUB_SHA" --build-meta dist/build-meta.json

      # The exact-SHA deploy: `--commit-hash` ties this upload to the commit CI just validated,
      # not "whatever main currently is" — the race a generic Cloudflare deploy hook would still
      # have. No `|| true`: an upload failure fails this job, and Production stays on whatever it
      # was already serving.
      - name: Deploy to Cloudflare Pages (Production)
        if: steps.guard-main.outputs.current == 'true'
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name=pokeportfolio-dev \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy verification: bounded retry only for CDN propagation, never a substitute for the
      # checks themselves. Runs the two existing, independent release verifiers against the live
      # Production URL with the exact commit just deployed. A failure fails this job; it does not
      # roll back or redeploy anything — rollback stays a manual, documented decision
      # (docs/GIT_WORKFLOW.md §11).
      - name: Verify Production actually serves this exact commit
        if: steps.guard-main.outputs.current == 'true'
        run: |
          for attempt in $(seq 1 15); do
            if node scripts/preview-verify.mjs --url https://pokeportfolio-dev.pages.dev --sha "$GITHUB_SHA"; then
              echo "preview-verify passed on attempt $attempt"
              break
            fi
            if [ "$attempt" = "15" ]; then
              echo "::error::Production never reached exact SHA $GITHUB_SHA after 15 attempts"
              exit 1
            fi
            echo "attempt $attempt: Production not yet at $GITHUB_SHA — retrying"
            sleep 10
          done
          node scripts/deployment-check.mjs
        env:
          DEPLOYMENT_URL: https://pokeportfolio-dev.pages.dev
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
